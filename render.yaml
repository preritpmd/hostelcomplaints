# One-click deploy on Render: New > Blueprint > pick this repo. Creates the website+API and a Postgres database.
services:
  - type: web
    name: hostel-complaints
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: hostel-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: ADMINS
        sync: false        # you type this in the Render dashboard, e.g. h2sec@iitdh.ac.in|YourStrongPassword|H2
databases:
  - name: hostel-db
    plan: free
